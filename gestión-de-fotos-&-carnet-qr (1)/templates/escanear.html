<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escáner de Acceso Door | Sesión Fotográfica</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- html5-qrcode library for camera QR reading -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #090d16;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .scanner-card {
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    #reader {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      min-height: 280px;
    }
    #reader video {
      object-fit: cover !important;
      border-radius: 16px;
    }
    .status-alert-container {
      transition: all 0.3s ease;
    }
    .avatar-scan-result {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #fff;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar navbar-dark bg-dark bg-opacity-50 py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/escanear">
        <div class="bg-success text-white p-2 rounded-3 d-flex align-items-center justify-content-center" style="width: 38px; height: 38px;">
          <i class="bi bi-qr-code-scan fs-5"></i>
        </div>
        <span class="fw-bold">Escáner de Puerta</span>
      </a>
      <div class="d-flex gap-2">
        <a href="/admin" class="btn btn-outline-info btn-sm rounded-pill px-3">
          <i class="bi bi-speedometer2 me-1"></i> Admin
        </a>
        <a href="/registro" class="btn btn-outline-light btn-sm rounded-pill px-3">
          <i class="bi bi-plus-lg me-1"></i> Registro
        </a>
        <a href="/logout" onclick="localStorage.removeItem('admin_token')" class="btn btn-outline-danger btn-sm rounded-pill px-3" title="Cerrar Sesión">
          <i class="bi bi-box-arrow-right me-1"></i> Salir
        </a>
      </div>
    </div>
  </nav>

  <div class="container my-auto py-3">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">

        <div class="scanner-card p-4">
          
          <div class="text-center mb-3">
            <span class="badge bg-primary bg-opacity-20 text-primary border border-primary px-3 py-1 rounded-pill small fw-bold">
              CONTROL DE ACCESO
            </span>
            <h3 class="fw-bold text-white mt-2 mb-1">Escanear Carnet QR</h3>
            <p class="text-secondary small">Apunta la cámara del dispositivo al código QR del carnet del estudiante.</p>
          </div>

          <!-- Select de Cámara -->
          <div class="mb-3">
            <label class="form-label text-secondary small d-flex align-items-center gap-1">
              <i class="bi bi-camera-video"></i> Seleccionar Cámara:
            </label>
            <select id="cameraSelect" class="form-select bg-dark text-white border-secondary rounded-3" onchange="switchCamera(this.value)">
              <option value="">Cargando cámaras...</option>
            </select>
          </div>

          <!-- Viewport del Escáner -->
          <div class="position-relative mb-3">
            <div id="reader"></div>
          </div>

          <!-- Botón de Reiniciar Cámara si se congela -->
          <div class="d-flex justify-content-between align-items-center mb-3">
            <button class="btn btn-sm btn-outline-secondary text-white rounded-pill px-3" onclick="restartScanner()">
              <i class="bi bi-arrow-repeat me-1"></i> Reiniciar Cámara
            </button>
            <span id="scanStatusText" class="badge bg-secondary">Escáner Listo</span>
          </div>

          <!-- Ingreso Manual de Respaldo -->
          <div class="p-3 bg-dark bg-opacity-50 rounded-4 border border-secondary border-opacity-25 mb-3">
            <label for="manualId" class="form-label text-light small fw-semibold">
              <i class="bi bi-keyboard me-1 text-info"></i> O Ingrese Código Manualmente:
            </label>
            <div class="input-group">
              <input type="text" id="manualId" class="form-control bg-dark text-white border-secondary" placeholder="Ej. EST-17234..." onkeypress="if(event.key==='Enter') performManualCheckin()">
              <button class="btn btn-primary px-3" type="button" onclick="performManualCheckin()">
                Validar <i class="bi bi-check2-circle ms-1"></i>
              </button>
            </div>
          </div>

          <!-- Banners de Resultado / Feedback Visual Grande -->
          <div id="resultContainer" class="status-alert-container d-none">
            <!-- Renderizado dinámico -->
          </div>

        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let html5QrCode = null;
    let isProcessing = false;
    let currentCameraId = null;

    // Sonidos Sintetizados con Web Audio API (Chime de éxito y advertencia)
    function playSound(type) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'success') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
          osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1); // A5
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'warning') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, audioCtx.currentTime); // A4
          osc.frequency.setValueAtTime(330, audioCtx.currentTime + 0.15); // E4
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.5);
        } else { // error
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(200, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        }
      } catch (e) {
        console.log('Audio API no soportado o bloqueado');
      }
    }

    // Inicializar Escáner
    function initScanner() {
      Html5Qrcode.getCameras().then(devices => {
        const cameraSelect = document.getElementById('cameraSelect');
        cameraSelect.innerHTML = '';

        if (devices && devices.length > 0) {
          // Preferir cámara trasera ('environment')
          let backCamera = devices.find(d => d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('trasera') || d.label.toLowerCase().includes('environment'));
          let selectedCam = backCamera ? backCamera.id : devices[0].id;

          devices.forEach(dev => {
            const opt = document.createElement('option');
            opt.value = dev.id;
            opt.textContent = dev.label || `Cámara ${cameraSelect.length + 1}`;
            if (dev.id === selectedCam) opt.selected = true;
            cameraSelect.appendChild(opt);
          });

          startScannerWithCamera(selectedCam);
        } else {
          cameraSelect.innerHTML = '<option value="">No se encontraron cámaras</option>';
          document.getElementById('scanStatusText').className = 'badge bg-warning';
          document.getElementById('scanStatusText').textContent = 'Usar Entrada Manual';
        }
      }).catch(err => {
        console.warn('Error accediendo a cámaras:', err);
        document.getElementById('cameraSelect').innerHTML = '<option value="">Permiso de Cámara Denegado/No disponible</option>';
        document.getElementById('scanStatusText').className = 'badge bg-danger';
        document.getElementById('scanStatusText').textContent = 'Usa Código Manual';
      });
    }

    function startScannerWithCamera(cameraId) {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          startCamInstance(cameraId);
        }).catch(() => startCamInstance(cameraId));
      } else {
        startCamInstance(cameraId);
      }
    }

    function startCamInstance(cameraId) {
      currentCameraId = cameraId;
      html5QrCode = new Html5Qrcode("reader");
      
      const config = { fps: 10, qrbox: { width: 220, height: 220 } };

      html5QrCode.start(
        cameraId, 
        config, 
        (decodedText, decodedResult) => {
          if (!isProcessing) {
            processCheckin(decodedText);
          }
        },
        (errorMessage) => {
          // Ignorar errores frame por frame silenciosamente
        }
      ).then(() => {
        document.getElementById('scanStatusText').className = 'badge bg-success';
        document.getElementById('scanStatusText').textContent = 'Escaneando...';
      }).catch(err => {
        console.error("Error al iniciar cámara:", err);
      });
    }

    function switchCamera(cameraId) {
      if (cameraId) startScannerWithCamera(cameraId);
    }

    function restartScanner() {
      if (currentCameraId) startScannerWithCamera(currentCameraId);
    }

    // Procesar Check-In con el servidor
    function processCheckin(code) {
      isProcessing = true;
      document.getElementById('scanStatusText').className = 'badge bg-info';
      document.getElementById('scanStatusText').textContent = 'Procesando QR...';

      fetch('/api/checkin', {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'X-Admin-Token': 'authenticated'
        },
        credentials: 'include',
        body: JSON.stringify({ estudiante_id: code })
      })
      .then(res => res.json())
      .then(data => {
        renderCheckinResult(data);
      })
      .catch(err => {
        console.error(err);
        renderCheckinResult({
          success: false,
          code: 'ERROR',
          message: 'Error de conexión con el servidor.'
        });
      })
      .finally(() => {
        // Re-habilitar escaneo tras 3.5 segundos
        setTimeout(() => {
          isProcessing = false;
          document.getElementById('scanStatusText').className = 'badge bg-success';
          document.getElementById('scanStatusText').textContent = 'Escaneando...';
        }, 3500);
      });
    }

    function performManualCheckin() {
      const val = document.getElementById('manualId').value.trim();
      if (val) {
        processCheckin(val);
        document.getElementById('manualId').value = '';
      }
    }

    // Renderizar Banner de Resultado
    function renderCheckinResult(data) {
      const container = document.getElementById('resultContainer');
      container.classList.remove('d-none');

      if (data.success && data.code === 'SUCCESS') {
        playSound('success');
        const s = data.estudiante;
        container.innerHTML = `
          <div class="alert alert-success border-0 bg-success bg-opacity-25 text-white p-4 rounded-4 shadow text-center animate__animated animate__fadeIn">
            <div class="d-flex justify-content-center mb-2">
              <img src="${s.foto_url}" class="avatar-scan-result" alt="${s.nombre}">
            </div>
            <div class="badge bg-success fs-6 px-3 py-1 rounded-pill mb-2">
              <i class="bi bi-check-circle-fill me-1"></i> ¡ACCESO AUTORIZADO!
            </div>
            <h2 class="fw-bold text-white mb-1">${s.nombre}</h2>
            <div class="fs-4 fw-extrabold text-warning">Turno de Sesión #${s.numero_orden}</div>
            <div class="small text-light opacity-75 mt-2">
              <i class="bi bi-clock-fill me-1"></i> Hora de entrada: ${s.hora_llegada}
            </div>
            ${s.fotos_extras ? `<div class="mt-2 badge bg-warning text-dark px-3 py-1"><i class="bi bi-star-fill me-1"></i> Requiere ${s.cantidad_fotos_extras} Fotos Extras</div>` : ''}
          </div>
        `;
      } else if (data.code === 'ALREADY_CHECKED_IN') {
        playSound('warning');
        const s = data.estudiante;
        container.innerHTML = `
          <div class="alert alert-warning border-0 bg-warning bg-opacity-25 text-white p-4 rounded-4 shadow text-center animate__animated animate__shakeX">
            <div class="badge bg-warning text-dark fs-6 px-3 py-1 rounded-pill mb-2">
              <i class="bi bi-exclamation-triangle-fill me-1"></i> CÓDIGO YA REGISTRADO
            </div>
            <h3 class="fw-bold text-white mb-1">${s ? s.nombre : ''}</h3>
            <div class="fs-5 fw-bold text-warning">Orden #${s ? s.numero_orden : ''}</div>
            <div class="mt-2 text-warning-emphasis fw-semibold">
              ${data.message}
            </div>
          </div>
        `;
      } else {
        playSound('error');
        container.innerHTML = `
          <div class="alert alert-danger border-0 bg-danger bg-opacity-25 text-white p-4 rounded-4 shadow text-center animate__animated animate__shakeX">
            <div class="badge bg-danger fs-6 px-3 py-1 rounded-pill mb-2">
              <i class="bi bi-x-circle-fill me-1"></i> ERROR DE LECTURA
            </div>
            <h4 class="fw-bold text-white mb-1">Carnet No Válido</h4>
            <div class="small text-light opacity-90 mt-1">${data.message}</div>
          </div>
        `;
      }

      // Auto ocultar resultado tras 4.5s
      setTimeout(() => {
        container.classList.add('d-none');
      }, 4500);
    }

    // Iniciar al cargar
    document.addEventListener('DOMContentLoaded', initScanner);
  </script>
</body>
</html>
